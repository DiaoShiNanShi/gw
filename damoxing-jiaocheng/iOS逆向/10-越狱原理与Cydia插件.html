<p>获取 root 权限，绕过沙盒限制，可写系统分区、装未签名 App。</p>
<hr>
<h2>2. 越狱类型</h2>
<table><thead><tr><th></th><th>特点</th></tr></thead><tbody><tr><td>完美越狱</td><td>重启后仍越狱，少</td></tr><tr><td>不完美</td><td>重启需电脑重新越狱</td></tr><tr><td>巨魔/TrollStore</td><td>免越狱装部分 IPA</td></tr></tbody></table>
<hr>
<h2>3. Cydia 生态</h2>
<p>Substrate/ElleKit 提供 Hook 框架；Frida 需装 frida-server。</p>
