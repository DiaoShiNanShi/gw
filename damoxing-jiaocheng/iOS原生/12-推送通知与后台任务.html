<p>Apple 服务器 → 设备 Token → 你的后端发推送。需证书/Key 配置。</p>
<hr>
<h2>2. 后台模式</h2>
<table><thead><tr><th>Mode</th><th>用途</th></tr></thead><tbody><tr><td>audio</td><td>后台播放</td></tr><tr><td>fetch</td><td>后台拉取</td></tr><tr><td>processing</td><td>后台处理任务</td></tr><tr><td>remote-notification</td><td>静默推送</td></tr></tbody></table>
<hr>
<h2>3. 后台下载模型</h2>
<p>用 <code>URLSessionConfiguration.background</code> 下载大模型文件，下完通知用户。</p>
