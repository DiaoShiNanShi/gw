<h2>1. 成本构成</h2>
<table><thead><tr><th>项</th><th>占比</th></tr></thead><tbody><tr><td>模型 API</td><td>60~80%</td></tr><tr><td>向量库</td><td>5~15%</td></tr><tr><td>服务器</td><td>10~20%</td></tr></tbody></table>
<hr>
<h2>2. 语义缓存</h2>
<p>相似问题命中缓存，不调 LLM。GPTCache、Redis + embedding 相似度。</p>
<hr>
<h2>3. 模型路由</h2>
<p>简单问题 → 小模型（便宜 10 倍）；复杂问题 → 大模型。</p>
<hr>
<h2>4. Prompt 压缩</h2>
<p>去废话、摘要历史、只检索相关片段。</p>
<hr>
<h2>5. 批处理</h2>
<p>非实时场景攒批调 API，部分厂商有 Batch 折扣。</p>
