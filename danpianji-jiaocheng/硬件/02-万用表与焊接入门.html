<h2>1. 万用表三件套</h2>
<ol>
<li><strong>测电压</strong>：确认 3.3V / 5V 供电正常</li>
<li><strong>测通断</strong>：检查焊接是否连通（蜂鸣档）</li>
<li><strong>测电阻</strong>：确认阻值正确</li>
</ol>
<h2>2. 安全红线</h2>
<ul>
<li>⚠️ 不要带电焊接</li>
<li>⚠️ 不要短路 VCC 和 GND</li>
<li>⚠️ ESP32 GPIO 只能 3.3V，5V 会烧</li>
</ul>
<h2>3. 焊接五步</h2>
<p>加热焊盘 → 送锡 → 移锡 → 停 1 秒 → 移烙铁。焊点应光滑饱满。</p>
