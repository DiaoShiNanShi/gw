<h2>1. 为什么要看原理图？</h2>
<p>做 iOS 要看 API 文档，做硬件要看原理图——每个引脚连了什么、电源怎么走。</p>
<h2>2. 阅读顺序</h2>
<ol>
<li>找 <strong>MCU 芯片</strong>（引脚最多）</li>
<li>看 <strong>电源</strong>（VCC → 稳压 → 3.3V）</li>
<li>看 <strong>引脚连接</strong>（LED→GPIO2, 按键→GPIO0…）</li>
<li>看 <strong>通信接口</strong>（I2C 传感器、SPI 屏）</li>
</ol>
