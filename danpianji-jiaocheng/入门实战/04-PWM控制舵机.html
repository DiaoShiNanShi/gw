<h2>PWM 是什么？</h2>
<p><strong>PWM = 快速开关，用占空比模拟「模拟电压」</strong>。舵机根据脉宽（1ms～2ms）转到不同角度。</p>
<pre><code>#include &lt;ESP32Servo.h&gt;
Servo myservo;
myservo.attach(13);
myservo.write(90);  // 转到 90 度</code></pre>
<p>应用：云台、机器人关节、窗帘控制。</p>
